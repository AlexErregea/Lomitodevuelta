# ============================================================================
# Configuración del CLI de Supabase. Solo se declaran las desviaciones de los
# valores por defecto; `supabase init` puede ampliar este archivo sin miedo.
# ============================================================================

project_id = "lomitodevuelta"

# retry-pending la invoca pg_cron con un secreto propio (EDGE_WEBHOOK_SECRET
# en la cabecera Authorization) — no usa JWT de Supabase.
[functions.retry-pending]
verify_jwt = false

# whatsapp-webhook la invoca Meta: se autentica con el verify token (GET) y
# la firma X-Hub-Signature-256 (POST), no con JWT.
[functions.whatsapp-webhook]
verify_jwt = false

# on-report-created la invocará el DB webhook con EDGE_WEBHOOK_SECRET (Sprint 3).
#
# Es la única función que importa un paquete del monorepo (@lomito/matching,
# para reusar EL MISMO motor de score que la web — matching-engine.md §2). Ese
# alias vive en functions/deno.json, pero el empaquetador del CLI no busca un
# import map en el directorio padre de la función: hay que señalárselo. Sin
# esta línea el despliegue falla con "Relative import path not prefixed with
# / or ./ or ../". Las otras tres no lo necesitan: solo importan ../_shared/.
[functions.on-report-created]
verify_jwt = false
import_map = "./functions/on-report-created/deno.json"

# lifecycle la invocará pg_cron con EDGE_WEBHOOK_SECRET (Sprint 3).
[functions.lifecycle]
verify_jwt = false
