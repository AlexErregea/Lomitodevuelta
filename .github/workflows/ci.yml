# ============================================================================
# CI mínima (docs/testing-strategy.md): en cada push y PR se valida que el
# monorepo instala, tipa, lintea y pasa tests. Sin despliegues aquí: la web
# la despliega Vercel con su propia integración de GitHub (ADR-0012).
# ============================================================================
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin `version:` a propósito: la versión de pnpm es la del campo
      # `packageManager` del package.json raíz, que es también la que usan
      # Vercel y la máquina del fundador. Si se declara aquí además de allá,
      # la action falla con ERR_PNPM_BAD_PM_VERSION al detectar dos fuentes.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
